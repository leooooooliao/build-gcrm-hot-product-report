name: Package skill release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package the skill
        run: |
          mkdir -p package/build-gcrm-hot-product-report
          cp SKILL.md package/build-gcrm-hot-product-report/
          cp -R agents scripts references package/build-gcrm-hot-product-report/
          cd package
          zip -r "../build-gcrm-hot-product-report-${GITHUB_REF_NAME}.zip" build-gcrm-hot-product-report

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "build-gcrm-hot-product-report-${GITHUB_REF_NAME}.zip" \
            --title "GCRM 品类爆品报告 ${GITHUB_REF_NAME}" \
            --notes "下载并解压到 Codex skills 目录。Release 附件的 download_count 用作累计下载次数。"
