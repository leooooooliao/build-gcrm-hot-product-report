name: Package skill release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("fs");
            const release = JSON.parse(fs.readFileSync("references/release.json", "utf8"));
            const expected = `v${release.installed_version}`;
            if (process.env.RELEASE_TAG !== expected) {
              throw new Error(`Tag ${process.env.RELEASE_TAG} does not match ${expected}`);
            }
          '

      - name: Package the skill
        run: |
          mkdir -p package/build-gcrm-hot-product-report
          cp SKILL.md package/build-gcrm-hot-product-report/
          cp -R agents scripts references package/build-gcrm-hot-product-report/
          cd package
          zip -r "../build-gcrm-hot-product-report.zip" build-gcrm-hot-product-report

      - name: Create checksum
        run: |
          sha256sum "build-gcrm-hot-product-report.zip" \
            > "build-gcrm-hot-product-report.zip.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "build-gcrm-hot-product-report.zip" \
            "build-gcrm-hot-product-report.zip.sha256" \
            --title "爆品助手 ${GITHUB_REF_NAME}" \
            --notes "本版修复素材链接复现不稳定的根因：所有 Analytics/BI 看板取数先检查 crm-data-query，存在时必须用‘用crm-data-query取数：<链接>’发起显式查询并校验筛选条件、字段与 Product ID；失败一次后才回退浏览器，能力检查、提示词、取数路由和回退原因全部写入交付合同。GCRM Top Product 暂时仍走浏览器/API/导出路径。报告新增严格相关性门槛下的近期市场信号，最多3条，只有同市场、匹配类目或推荐品、来源与日期可核验且会改变商家动作时才展示，否则整段省略。推荐调用话术：使用CNOB Skill，帮我做一份类目爆品报告：国家 <国家>，类目 <GCRM一级或二级类目>，时间 <日期范围>。下载 build-gcrm-hot-product-report.zip 并校验同名 SHA-256 后解压完整工具包。请先识别当前 AI 平台支持的是 Skill、Project Instructions、Agent Rules 还是其他扩展机制，再安装到对应位置；不要默认使用 Codex。从 v1.4.0 起，Skill 每次调用都会检查此仓库的最新稳定 Release。ZIP 附件的 download_count 会同时包含新安装和版本更新，不等于独立用户数。"
